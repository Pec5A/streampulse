groups:
  - name: streampulse-auth
    rules:
      # Business alert: fires on abnormal auth *outcomes*, not on server
      # errors — a spike of invalid_credentials can mean credential
      # stuffing/brute force just as much as a broken client release.
      # Kept separate from the technical alert below on purpose, same
      # split rationale as the Grafana dashboard (docs/adr/0005).
      - alert: StreamPulseAuthHighFailureRate
        expr: |
          (
            sum(rate(streampulse_auth_logins_total{result!="success"}[5m]))
            /
            sum(rate(streampulse_auth_logins_total[5m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
          domain: business
        annotations:
          summary: "More than 50% of login attempts are failing"
          description: >-
            Over the last 5 minutes, non-success login outcomes
            (invalid_credentials or error) exceeded 50% of total attempts
            for 2 minutes straight. Could be a credential-stuffing attempt,
            a broken mobile release, or the auth DB degrading.
          runbook_url: "docs/runbooks/alert-auth-high-failure-rate.md"

      # Technical alert: same auth surface, but the SRE-facing signal
      # (5xx rate) rather than the product-facing one above.
      - alert: StreamPulseAuthHighErrorRate
        expr: |
          (
            sum(rate(streampulse_http_requests_total{path=~".*/api/v1/auth/.*", status=~"5.."}[5m]))
            /
            sum(rate(streampulse_http_requests_total{path=~".*/api/v1/auth/.*"}[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          domain: technical
        annotations:
          summary: "Auth endpoints 5xx rate above 5%"
          description: >-
            More than 5% of requests to /api/v1/auth/* returned a 5xx over
            the last 5 minutes. Likely a DB connectivity issue or a bad
            deploy — check `docker compose logs api`.
          runbook_url: "docs/runbooks/alert-auth-high-error-rate.md"

      - alert: StreamPulseAuthHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(streampulse_http_request_duration_seconds_bucket{path=~".*/api/v1/auth/.*"}[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
          domain: technical
        annotations:
          summary: "Auth p95 latency above 1s"
          description: >-
            95th percentile latency on /api/v1/auth/* has been above 1s
            for 5 minutes — bcrypt cost, DB pool exhaustion, or noisy
            neighbor on the compose host are the usual suspects here.
          runbook_url: "docs/runbooks/alert-auth-high-latency.md"

  - name: streampulse-streaming
    rules:
      # Business alert: listeners are being dropped, which the product owner
      # feels as "the stream cuts out", long before any HTTP metric moves —
      # an evicted listener's request ends normally, with a 200.
      # Threshold is a count, not a rate: a single slow listener on a bad
      # connection is normal, a handful in ten minutes is the hub shedding
      # an audience it can no longer serve.
      - alert: StreamPulseListenersFallingBehind
        expr: sum(increase(streampulse_listener_evictions_total[10m])) > 3
        for: 5m
        labels:
          severity: warning
          domain: business
        annotations:
          summary: "Listeners are being evicted for falling behind"
          description: >-
            More than 3 listeners were disconnected in 10 minutes for not
            keeping up with the broadcast. Either the broadcaster's bitrate
            outruns what the audience can absorb, or the API host is too
            loaded to fan chunks out fast enough.
          runbook_url: "docs/runbooks/alert-listeners-falling-behind.md"

      # Business alert: a stream the product says is "live" while no audio is
      # moving. Listeners are connected to silence, and nothing else in the
      # stack reports a problem — the hub is healthy, it just has nothing to
      # forward.
      #
      # `for` is deliberately long. A broadcaster pausing on air keeps the
      # hub open with zero bytes flowing, and that is a legitimate state:
      # anything shorter would page someone every time a DJ pauses.
      - alert: StreamPulseBroadcastSilent
        expr: |
          streampulse_active_streams > 0
          and
          rate(streampulse_broadcast_bytes_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
          domain: business
        annotations:
          summary: "A stream is live but no audio is being published"
          description: >-
            At least one stream has been marked live for 10 minutes without a
            single byte published. Usually a broadcaster whose upload died
            without closing the connection, leaving the hub open and its
            listeners on silence.
          runbook_url: "docs/runbooks/alert-broadcast-silent.md"
