# Tempo — trace storage for the local stack.
#
# Local filesystem backend on purpose: the point of the compose stack is that a
# reviewer can run `docker compose up` and follow a request end to end, not
# that it survives a restart. A real deployment swaps this block for object
# storage without touching the API or the collector.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
