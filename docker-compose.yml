services:
  api:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://streampulse:streampulse@postgres:5432/streampulse?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-chars-min}
      ENVIRONMENT: development
      STORAGE_PATH: /var/lib/streampulse/uploads
    ports:
      - "8080:8080"
    volumes:
      # Without this, restarting the stack drops every uploaded file while the
      # tracks rows survive — leaving rows that point at objects which no
      # longer exist. The API answers those 404 rather than 500 (see ADR
      # 0009), but the audio is gone all the same.
      - uploads_data:/var/lib/streampulse/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streampulse
      POSTGRES_USER: streampulse
      POSTGRES_PASSWORD: streampulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streampulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # One mount per provisioning directory, never a file mount nested
      # inside a directory mount at the same path — the two fight over the
      # same mountpoint and Docker Desktop on macOS fails with "read-only
      # file system" trying to create it. dashboards.yml (the provider
      # config) lives inside deployments/grafana/dashboards/ alongside the
      # dashboard JSON it provisions, precisely so this stays one mount.
      - ./deployments/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployments/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:
