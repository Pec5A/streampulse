name: CD

# Continuous delivery: every commit that lands on main is turned into a
# versioned, downloadable artefact without anyone running a command locally —
# an API image on GHCR and a mobile build for each target platform.
#
# Triggered on push to main (not on tags) so that the image for a given commit
# exists whether or not anyone remembers to tag a release. Tagging then only
# decides what gets *promoted*, never what gets *built*.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Two pushes in quick succession must not race to publish the same tags.
  # Not cancel-in-progress: an interrupted push leaves a half-uploaded image
  # manifest, and a build already underway is cheaper to finish than to redo.
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-image:
    name: Publish API image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No third-party secret to provision: the token GitHub already
          # injects is enough to push to this repository's own registry.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamped into the binary, reported by /health. Without it a
          # deployed container cannot answer "which build am I", and a
          # rollback decision turns into archaeology.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image actually boots
        # Publishing an image that has never been run is publishing a guess.
        # This starts the exact artefact that was just pushed, against a real
        # Postgres, and checks it reports the version it claims to be.
        run: |
          docker network create cd-check
          docker run -d --name pg --network cd-check \
            -e POSTGRES_DB=streampulse -e POSTGRES_USER=streampulse -e POSTGRES_PASSWORD=streampulse \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U streampulse && break
            sleep 2
          done
          docker run -d --name api --network cd-check -p 8080:8080 \
            -e DATABASE_URL='postgres://streampulse:streampulse@pg:5432/streampulse?sslmode=disable' \
            -e JWT_SECRET='ci-only-secret-at-least-32-characters-long' \
            ghcr.io/${{ github.repository }}-api:sha-${{ github.sha }}
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8080/health 2>/dev/null) && break
            sleep 2
          done
          echo "health: $body"
          echo "$body" | grep -q '"status":"ok"' || { docker logs api; exit 1; }
          echo "$body" | grep -q "${{ steps.meta.outputs.version }}" || {
            echo "::error::image does not report the version it was tagged with"
            docker logs api
            exit 1
          }

  mobile-artifacts:
    name: Build mobile artefacts
    runs-on: ubuntu-latest
    strategy:
      # One job per target so a broken web build does not hide a working APK,
      # and the failure names the platform directly.
      fail-fast: false
      matrix:
        include:
          - target: apk
            build: build apk --release
            path: build/app/outputs/flutter-apk/app-release.apk
          - target: web
            build: build web --release
            path: build/web
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        working-directory: mobile
        # The API URL is injected at build time, never hardcoded: the same
        # source tree has to produce a staging and a production artefact.
        run: flutter ${{ matrix.build }} --dart-define=API_URL=${{ vars.API_URL || 'http://localhost:8080' }}

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: streampulse-${{ matrix.target }}-${{ github.sha }}
          path: mobile/${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to production
    needs: api-image
    runs-on: ubuntu-latest
    # Le job ne tourne que si la variable de dépôt FLY_APP est définie.
    #
    # C'est délibérément une *variable* et non le secret : GitHub n'autorise
    # pas `secrets` dans un `if` de job, et surtout un job de déploiement qui
    # échoue faute de token laisse la pipeline rouge en permanence — le CD
    # ressemble alors à du CD tout en ne déployant rien, et plus personne ne
    # lit le signal. Tant que FLY_APP n'est pas définie, le job est *ignoré*,
    # ce qui est honnête : on n'annonce pas un déploiement qu'on ne fait pas.
    if: ${{ vars.FLY_APP != '' }}
    environment:
      name: production
      url: https://${{ vars.FLY_APP }}.fly.dev
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the image that was just published
        # --image, jamais un build par Fly : l'artefact déployé est exactement
        # celui que la CI a vérifié, pas un second build qui lui ressemble.
        # Fly ne bascule le trafic que si le check /health de fly.toml passe,
        # donc une image cassée ne remplace pas une version qui marchait.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config deployments/fly/fly.toml \
            --app "${{ vars.FLY_APP }}" \
            --image "ghcr.io/${{ github.repository }}-api:sha-${{ github.sha }}" \
            --strategy rolling \
            --wait-timeout 300

      - name: Verify production reports the version just deployed
        # Un déploiement "réussi" qui sert encore l'ancienne version est le
        # mode de panne qu'on ne voit pas. On interroge la prod et on exige
        # qu'elle annonce le commit de ce run.
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS "https://${{ vars.FLY_APP }}.fly.dev/health" 2>/dev/null) && break
            sleep 5
          done
          echo "health: $body"
          echo "$body" | grep -q '"status":"ok"' || exit 1
          echo "$body" | grep -q "${{ github.sha }}" || {
            echo "::error::la production ne sert pas le commit déployé"
            exit 1
          }
