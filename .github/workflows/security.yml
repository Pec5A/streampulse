name: Security

# Dependency vulnerability scanning (ticket S3). Kept in its own workflow —
# separate from ci.yml — so it composes cleanly with the CI-hardening ticket
# (Y3) and clearly separates "quality" from "security".
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned to the exact latest patch, not a floating '1.26': that
          # floating pin resolved to a stale 1.26.5 toolchain with 4 known
          # stdlib CVEs already fixed in 1.26.6, making every PR's
          # govulncheck fail on the Go standard library itself — nothing to
          # do with application code. Bump this again whenever govulncheck
          # flags a newer stdlib fix release.
          go-version: '1.26.6'

      # govulncheck reports only vulnerabilities whose affected functions are
      # actually reachable from our code — low false-positive rate.
      - name: govulncheck (Go vulnerability database)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.73.0

      # Fails the build on HIGH/CRITICAL, fixable vulnerabilities in go.mod.
      - name: Trivy dependency scan
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress backend
