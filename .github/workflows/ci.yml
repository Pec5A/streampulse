name: CI

on:
  push:
    branches: [main, develop]
  # No `branches:` filter here on purpose: with stacked PRs (a ticket
  # branching off another unmerged ticket's branch instead of main), a
  # PR's base is often not `main` yet. Restricting to branches: [main]
  # silently skipped CI on those PRs entirely (found while working on
  # ticket Y3 — Y2 and Y3's PRs never ran CI because of this).
  pull_request:

jobs:
  backend-quality:
    name: Go Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Kept in sync with security.yml's pin — see that file's comment
          # for why this isn't a floating '1.26'.
          go-version: '1.26.6'

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        # Remplace l'étape staticcheck autonome : golangci-lint fait tourner
        # staticcheck en plus d'errcheck, govet, ineffassign et unused, sous
        # une seule configuration versionnée (backend/.golangci.yml).
        #
        # gosec reste une étape séparée juste en dessous : golangci-lint sait
        # l'exécuter, mais avec un filtrage de sévérité différent, et affaiblir
        # une vérification de sécurité pour économiser une étape est un mauvais
        # échange.
        #
        # Installé par `go install` et non par golangci-lint-action, pour la
        # même raison que le toolchain a dû être épinglé en #24 : l'action
        # télécharge un binaire pré-compilé, et un binaire construit avec une
        # version de Go antérieure à celle du module refuse de charger la
        # configuration ("the Go language version used to build golangci-lint
        # is lower than the targeted Go version"). Compiler avec le toolchain
        # du job supprime la classe entière du problème — au prix d'une
        # minute de build.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: Security scan (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -severity medium ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        env:
          # Honest baseline as of ticket Y3 (~57% overall backend
          # coverage). Raise as more tickets land real tests — don't jump
          # ahead of actual coverage gains.
          COVERAGE_FLOOR: '50'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}% (floor: ${COVERAGE_FLOOR}%)"
          if (( $(echo "$COVERAGE < $COVERAGE_FLOOR" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below ${COVERAGE_FLOOR}% floor"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  mobile-quality:
    name: Flutter Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  secrets-check:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --no-banner

  deploy-smoke-test:
    name: Deploy smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the stack
        run: docker compose up -d --build api postgres

      - name: Smoke test the deployed stack
        run: ./scripts/smoke-test.sh

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Tear down
        if: always()
        run: docker compose down -v
